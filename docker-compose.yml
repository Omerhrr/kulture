# Kaduna Kulture — full-stack composition (local/staging).
# Production hardening (secrets, TLS, node isolation) is documented in
# docs/security.md and must be reviewed before accepting real payments.

version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kk
      POSTGRES_PASSWORD: kk_dev_change_me
      POSTGRES_DB: kaduna
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kk -d kaduna"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Optional per spec: cache/rate limiting only — NEVER the ledger.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      KK_ENV: local
      KK_DATABASE_URL: postgresql+asyncpg://kk:kk_dev_change_me@db:5432/kaduna
      KK_LIGHTNING_PROVIDER: mock
      KK_LLM_BASE_URL: http://llm-bridge:8100/v1
      KK_JWT_SECRET: change-me-in-staging-and-prod
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  llm-bridge:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./services/llm-bridge:/app
      - bridge_node_modules:/root/.bun/install/cache
    command: sh -c "bun install && bun bridge.ts"
    environment:
      PORT: 8100

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  caddy_data:
  bridge_node_modules:
