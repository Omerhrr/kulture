# Kaduna Kulture - production stack (VPS).
#   cp infra/env.production.example .env   # fill in the secrets
#   docker compose up -d --build
# Postgres and the app stay on the private compose network.
#
# Two ways to put it online:
#  - own server:    COMPOSE_PROFILES=standalone  -> this stack's Caddy takes 80/443
#  - shared server: an existing reverse proxy (e.g. another Caddy) already owns
#    80/443 -> leave the profile off and add infra/compose.shared-proxy.yml via
#    COMPOSE_FILE (see docs/deploy.md, "Server already running other sites")

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kaduna}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      KK_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kaduna}
      KK_CORS_ORIGINS: '["https://${KK_DOMAIN}"]'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')\""]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    logging: *logging

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

  caddy:
    image: caddy:2-alpine
    profiles: ["standalone"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KK_DOMAIN: ${KK_DOMAIN:?set KK_DOMAIN in .env}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
